name: Update Rock Solid Man Podcast Feed (Weekly)

on:
  schedule:
    # Episodes drop Mondays 7pm ET (~23:00 UTC in EDT, ~00:00 UTC Tue in EST).
    # Run Tuesday 10:00 UTC (~5-6am ET) so it's comfortably after either case.
    - cron: '0 10 * * 2'
  workflow_dispatch: {}
  push:
    paths:
      - 'generate-podcast-feed.js'
      - '.github/workflows/daily-podcast-feed.yml'

jobs:
  update-podcast-feed:
    runs-on: ubuntu-latest
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install needed — script uses native fetch only.

      - name: 🎙️ Pull episodes from Substack RSS
        run: node generate-podcast-feed.js

      - name: ✅ Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(podcast): refresh podcast-episodes.json"
          file_pattern: podcast-episodes.json
